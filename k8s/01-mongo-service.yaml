# Headless Service: gives every StatefulSet pod a stable DNS name (mongo-0.mongo, mongo-1.mongo, ...)
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: emi
  labels:
    app: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
